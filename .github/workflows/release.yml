name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the core with no extras
        run: python -m pip install -e .
      - name: Check version consistency
        run: ppt-agent-release check-version --root .
      - name: Build the release manifest
        run: ppt-agent-release build --root . -o dist/release-manifest.json
      - name: Verify the manifest against the working tree
        run: ppt-agent-release verify --root . --manifest dist/release-manifest.json
      - name: Build the sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ppt-agent-release
          path: dist/
          if-no-files-found: error
