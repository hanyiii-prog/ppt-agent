name: test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-impress poppler-utils fonts-noto-cjk
      - name: Install package and QA dependencies
        run: python -m pip install -e ".[pptx,qa,test]"
      - name: Run tests
        run: |
          ec=0
          pytest -q --continue-on-collection-errors > pytest.log 2>&1 || ec=$?
          tail -60 pytest.log
          if [ "$ec" -ne 0 ]; then
            grep -E "^(FAILED|ERROR)" pytest.log | head -20 > probe-fails.txt || true
            while IFS= read -r line; do
              echo "::error::$(echo "$line" | cut -c1-200)"
            done < probe-fails.txt
          fi
          exit $ec

  dependency-free-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the core with no extras
        run: python -m pip install -e .
      - name: The core must import without presentation engines
        run: python -c "import ppt_agent; print(ppt_agent.__version__)"
      - name: Capability negotiation must degrade instead of failing
        run: ppt-agent capabilities

  benchmark-and-mcp:
    runs-on: ubuntu-latest
    needs: python-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install system render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-impress poppler-utils fonts-noto-cjk
      - name: Install package and QA dependencies
        run: python -m pip install -e ".[pptx,qa,test]"
      - name: Run the reproducible benchmark suite
        run: ppt-agent benchmark benchmarks/cases -o dist/benchmark-report.json
      - name: End-to-end build through the CLI
        run: |
          ppt-agent build benchmarks/cases/01_project_review.md -o dist/deck --stem ci --no-gate
      - name: MCP stdio handshake
        run: |
          python - <<'PY'
          import io, json
          from ppt_agent.mcp import serve

          requests = [
              {"jsonrpc": "2.0", "id": 1, "method": "initialize", "params": {"protocolVersion": "2025-06-18"}},
              {"jsonrpc": "2.0", "id": 2, "method": "tools/list"},
          ]
          stdin = io.StringIO("\n".join(json.dumps(item) for item in requests) + "\n")
          stdout = io.StringIO()
          assert serve(stdin, stdout, workspace="dist") == 0
          responses = [json.loads(line) for line in stdout.getvalue().splitlines() if line.strip()]
          assert responses[0]["result"]["serverInfo"]["name"] == "ppt-agent", responses[0]
          assert len(responses[1]["result"]["tools"]) == 17, responses[1]
          print("MCP handshake OK")
          PY
